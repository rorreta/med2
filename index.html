<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor UV - Turismo DuocUC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #1a1a1a;
            --uv-color: #3EA72D; /* Color inicial (Bajo) */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.8s ease;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-top: 20px;
        }

        .logo-school {
            font-weight: 700;
            letter-spacing: -1px;
            font-size: 1.2rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Contenedor Principal UV */
        .uv-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .uv-circle {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 15px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .uv-value {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
        }

        .uv-label {
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .max-ref {
            font-size: 0.9rem;
            background: rgba(0,0,0,0.05);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Tarjeta de Ubicación */
        .location-card {
            background: white;
            color: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .city-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .coords {
            font-family: monospace;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Adaptación para modo oscuro/claro automático según UV */
        .light-text { color: white; }
        .dark-text { color: #1a1a1a; }

        @media (max-width: 480px) {
            .uv-circle {
                width: 220px;
                height: 220px;
            }
            .uv-value { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo-school">Escuela de Turismo</div>
        <p>Duoc UC</p>
    </header>

    <main class="uv-container">
        <div class="uv-circle" id="uvCircle">
            <span class="uv-label">Índice UV</span>
            <span class="uv-value" id="uvIndex">--</span>
        </div>
        <div class="max-ref" id="maxUV">Máx hoy: --</div>
    </main>

    <div class="location-card">
        <div class="city-name" id="cityName">Detectando ubicación...</div>
        <div class="coords" id="coordsDisplay">0.000, 0.000</div>
    </div>

    <script>
        const uvConfig = {
            low:      { val: 2,  color: '#3EA72D', label: 'Bajo', text: 'light' },
            moderate: { val: 5,  color: '#FFF300', label: 'Moderado', text: 'dark' },
            high:     { val: 7,  color: '#F18B00', label: 'Alto', text: 'light' },
            veryHigh: { val: 10, color: '#E53210', label: 'Muy Alto', text: 'light' },
            extreme:  { val: 11, color: '#B567A4', label: 'Extremo', text: 'light' }
        };

        function getUVStyle(index) {
            if (index <= 2) return uvConfig.low;
            if (index <= 5) return uvConfig.moderate;
            if (index <= 7) return uvConfig.high;
            if (index <= 10) return uvConfig.veryHigh;
            return uvConfig.extreme;
        }

        async function fetchWeatherData(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=uv_index_max&current=uv_index&timezone=auto`);
                const data = await response.json();
                updateUI(data);
                reverseGeocode(lat, lon);
            } catch (error) {
                console.error("Error obteniendo datos:", error);
            }
        }

        async function reverseGeocode(lat, lon) {
            // Usamos el servicio de OpenStreetMap para obtener la ciudad
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                const city = data.address.city || data.address.town || data.address.village || "Ubicación desconocida";
                document.getElementById('cityName').innerText = city;
            } catch (e) {
                document.getElementById('cityName').innerText = "Coordenadas Detectadas";
            }
        }

        function updateUI(data) {
            const currentUV = data.current.uv_index;
            const maxToday = data.daily.uv_index_max[0];
            const style = getUVStyle(currentUV);

            // Actualizar Textos
            document.getElementById('uvIndex').innerText = currentUV.toFixed(1);
            document.getElementById('maxUV').innerText = `Máximo hoy: ${maxToday.toFixed(1)} UV`;
            
            // Actualizar Colores
            document.body.style.backgroundColor = style.color;
            document.documentElement.style.setProperty('--bg-color', style.color);
            
            // Ajustar contraste de texto
            const body = document.body;
            if (style.text === 'light') {
                body.classList.add('light-text');
                body.classList.remove('dark-text');
            } else {
                body.classList.add('dark-text');
                body.classList.remove('light-text');
            }
        }

        function init() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const { latitude, longitude } = position.coords;
                    document.getElementById('coordsDisplay').innerText = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
                    fetchWeatherData(latitude, longitude);
                }, () => {
                    document.getElementById('cityName').innerText = "Acceso denegado a GPS";
                });
            } else {
                document.getElementById('cityName').innerText = "Geolocalización no soportada";
            }
        }

        init();
    </script>
</body>
</html>
