<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Index Monitor Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --uv-color: #fbbf24; /* Color dinámico según nivel */
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .uv-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            width: 320px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .label {
            color: var(--text-dim);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .uv-values {
            margin-bottom: 1.5rem;
        }

        .current-uv {
            font-size: 4rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
            margin: 0.5rem 0;
        }

        .max-uv-badge {
            background: rgba(251, 191, 36, 0.1);
            color: var(--uv-color);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        /* Barra de comparación visual */
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 4px;
            margin: 1.5rem 0;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #fcd34d, #f59e0b);
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }

        .footer-info {
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .risk-level {
            font-weight: bold;
            color: var(--uv-color);
        }
    </style>
</head>
<body>

    <div class="uv-card">
        <div class="header">
            <span class="label">Índice UV</span>
            <span class="max-uv-badge">MÁX. HOY: 11</span>
        </div>

        <div class="uv-values">
            <div class="current-uv" id="uv-current">7.2</div>
            <div class="risk-level">Riesgo Alto</div>
        </div>

        <!-- Comparativa Visual -->
        <div class="progress-container">
            <!-- El width debería ser (actual / maximo) * 100 -->
            <div class="progress-bar" style="width: 65%;"></div>
        </div>

        <div class="footer-info">
            Usa protección solar. El pico máximo se espera a las 13:45h.
        </div>
    </div>

</body>
</html>
