<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor UV - Turismo DuocUC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #333;
            --uv-low: #3ea72d;
            --uv-mod: #fff300;
            --uv-high: #f18b00;
            --uv-vhigh: #e53210;
            --uv-ext: #b567a4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Simulación de pantalla móvil */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.3);
        }

        header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .location-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .category-label {
            display: inline-block;
            padding: 5px 15px;
            border: 2px solid #000;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
            background: white;
        }

        .uv-circle {
            width: 220px;
            height: 220px;
            border: 10px solid #fff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: white;
            margin-bottom: 30px;
        }

        .uv-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
        }

        .uv-text {
            font-size: 1rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        .max-box {
            width: 90%;
            border-radius: 20px;
            padding: 15px;
            color: #000;
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        .max-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .ppe-text {
            font-size: 0.75rem;
            margin-top: 10px;
            line-height: 1.3;
            font-style: italic;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <header>
        <h1>Monitor UV</h1>
        <div class="location-box" id="location-info">Detectando ubicación...</div>
    </header>

    <div id="main-content" style="display: none; flex-direction: column; align-items: center; width: 100%;">
        <div class="category-label" id="uv-cat-now">CARGANDO</div>

        <div class="uv-circle">
            <span class="uv-value" id="uv-now">0</span>
            <span class="uv-text">Índice UV</span>
        </div>

        <div class="max-box" id="max-info-box">
            <div class="max-title">Máximo hoy: <span id="uv-max-val">0</span> a las <span id="uv-max-time">00:00</span></div>
            <div class="ppe-text" id="ppe-recommendation"></div>
        </div>
        
        <p style="font-size: 0.6rem; margin-top: 20px; opacity: 0.7;">Escuela de Turismo DuocUC</p>
    </div>

    <div id="loader">Consultando satélites...</div>
</div>

<script>
    const uvColors = {
        low: { color: "#3ea72d", text: "BAJO", ppe: "No se requiere protección. Puede permanecer en el exterior sin riesgo." },
        mod: { color: "#fff300", text: "MODERADO", ppe: "Use protector solar, sombrero y gafas de sol. Busque sombra en horas centrales." },
        high: { color: "#f18b00", text: "ALTO", ppe: "Protección necesaria. Use camisa, protector solar FPS 30+ y sombrero." },
        vhigh: { color: "#e53210", text: "MUY ALTO", ppe: "Reduzca exposición entre 11am y 4pm. Busque sombra, use ropa protectora." },
        ext: { color: "#b567a4", text: "EXTREMO", ppe: "Riesgo extremo. Evite salir en horas centrales. Camisa, gafas y protector FPS 50+ obligatorios." }
    };

    function getUVData(index) {
        if (index <= 2) return uvColors.low;
        if (index <= 5) return uvColors.mod;
        if (index <= 7) return uvColors.high;
        if (index <= 10) return uvColors.vhigh;
        return uvColors.ext;
    }

    async function init() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    // Obtener ciudad
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                    const geoData = await geoRes.json();
                    const city = geoData.address.city || geoData.address.town || geoData.address.village || "Ubicación desconocida";
                    
                    document.getElementById('location-info').innerText = `${city} (${lat.toFixed(2)}, ${lon.toFixed(2)})`;

                    // Obtener datos UV de Open-Meteo
                    const uvRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=uv_index&daily=uv_index_max,uv_index_max_time&timezone=auto`);
                    const uvData = await uvRes.json();

                    updateUI(uvData);
                } catch (error) {
                    document.getElementById('loader').innerText = "Error al obtener datos.";
                }
            }, () => {
                document.getElementById('loader').innerText = "Acceso a ubicación denegado.";
            });
        }
    }

    function updateUI(data) {
        const currentUV = data.current.uv_index;
        const maxUV = data.daily.uv_index_max[0];
        const maxTimeStr = data.daily.uv_index_max_time[0];
        const maxTime = new Date(maxTimeStr).getHours() + ":00";

        const currentInfo = getUVData(currentUV);
        const maxInfo = getUVData(maxUV);

        // UI en tiempo real
        document.body.style.backgroundColor = currentInfo.color;
        document.getElementById('uv-now').innerText = currentUV.toFixed(1);
        document.getElementById('uv-cat-now').innerText = currentInfo.text;
        document.getElementById('uv-cat-now').style.borderColor = "#000";

        // UI Máximo Diario
        document.getElementById('uv-max-val').innerText = maxUV.toFixed(1);
        document.getElementById('uv-max-time').innerText = maxTime;
        document.getElementById('max-info-box').style.backgroundColor = maxInfo.color;
        document.getElementById('ppe-recommendation').innerText = `EPP: ${maxInfo.ppe}`;

        // Mostrar contenido
        document.getElementById('loader').style.display = 'none';
        document.getElementById('main-content').style.display = 'flex';
    }

    init();
</script>

</body>
</html>
