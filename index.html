<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor UV - Duoc UC Turismo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #333;
            --uv-low: #3EA72D;
            --uv-mod: #FFF300;
            --uv-high: #F18B00;
            --uv-very-high: #E53210;
            --uv-extreme: #B567A4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            transition: background-color 0.8s ease;
            text-align: center;
        }

        header {
            margin-top: 20px;
            width: 100%;
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
            opacity: 0.8;
        }

        .location-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            display: inline-block;
            min-width: 80%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .city-name {
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
        }

        .coordinates {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .uv-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .uv-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 8px solid rgba(255,255,255,0.5);
        }

        .uv-value {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
        }

        .uv-label {
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            margin-top: -5px;
        }

        .footer-info {
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 20px;
            width: 100%;
        }

        .max-info {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .school-tag {
            font-size: 0.7rem;
            margin-top: 10px;
            opacity: 0.6;
            font-weight: 700;
        }

        /* Colores de texto según fondo */
        .light-text { color: white; }
        .dark-text { color: #333; }

    </style>
</head>
<body>

    <header>
        <h1>Monitor Índice UV</h1>
        <div class="location-card" id="location-box">
            <span class="city-name" id="city">Buscando ubicación...</span>
            <span class="coordinates" id="coords">-- , --</span>
        </div>
    </header>

    <div class="uv-container">
        <div class="uv-circle" id="uv-circle">
            <span class="uv-value" id="uv-index">--</span>
            <span class="uv-label">Índice UV</span>
        </div>
    </div>

    <div class="footer-info">
        <div class="max-info" id="max-uv-info">
            Máximo hoy: -- a las --:--
        </div>
        <div class="school-tag">ESCUELA DE TURISMO • DUOC UC</div>
    </div>

    <script>
        const uvCircle = document.getElementById('uv-circle');
        const uvValue = document.getElementById('uv-index');
        const cityEl = document.getElementById('city');
        const coordsEl = document.getElementById('coords');
        const maxInfoEl = document.getElementById('max-uv-info');

        async function getUVData(lat, lon) {
            try {
                // 1. Obtener datos meteorológicos de Open-Meteo
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=uv_index&hourly=uv_index&daily=uv_index_max&timezone=auto`);
                const data = await response.json();

                // 2. Obtener nombre de ciudad con Nominatim
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                const geoData = await geoRes.json();
                const city = geoData.address.city || geoData.address.town || geoData.address.village || "Ubicación desconocida";

                updateUI(data, city, lat, lon);
            } catch (error) {
                cityEl.innerText = "Error al cargar datos";
                console.error(error);
            }
        }

        function updateUI(data, city, lat, lon) {
            const currentUV = data.current.uv_index;
            const maxUV = data.daily.uv_index_max[0];
            
            // Encontrar la hora del máximo
            const hourlyUV = data.hourly.uv_index;
            const maxHourIndex = hourlyUV.indexOf(Math.max(...hourlyUV.slice(0, 24)));
            const maxTime = new Date(data.hourly.time[maxHourIndex]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Actualizar textos
            uvValue.innerText = currentUV.toFixed(1);
            cityEl.innerText = city;
            coordsEl.innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            maxInfoEl.innerText = `Máximo hoy: ${maxUV.toFixed(1)} proyectado a las ${maxTime}`;

            // Determinar color y escala
            let color = "";
            let textClass = "dark-text";

            if (currentUV <= 2) { color = "#3EA72D"; textClass = "light-text"; }
            else if (currentUV <= 5) { color = "#FFF300"; textClass = "dark-text"; }
            else if (currentUV <= 7) { color = "#F18B00"; textClass = "light-text"; }
            else if (currentUV <= 10) { color = "#E53210"; textClass = "light-text"; }
            else { color = "#B567A4"; textClass = "light-text"; }

            // Aplicar estilos
            document.body.style.backgroundColor = color;
            uvCircle.style.color = color; // El número dentro del círculo lleva el color de la escala
            
            // Ajustar contraste de textos generales
            document.body.className = textClass;
        }

        // Iniciar geolocalización
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    getUVData(pos.coords.latitude, pos.coords.longitude);
                },
                () => {
                    cityEl.innerText = "Acceso a ubicación denegado";
                }
            );
        } else {
            cityEl.innerText = "Geolocalización no soportada";
        }
    </script>
</body>
</html>
